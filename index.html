<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09191e">
  <title>冰痕 · Ice Imprint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header><img class="mark" src="assets/ice-imprint-logo-transparent.png" alt="冰痕标志" width="274" height="300"><span class="brand">冰痕</span></header>
    <main><div class="stage-wrap"><canvas class="stage" id="stage" aria-label="冰痕交互画布"></canvas><canvas id="particleOverlay" aria-hidden="true"></canvas><canvas id="handOverlay" aria-label="双手21个实时关节点与骨架"></canvas></div></main>
    <footer>
      <button class="primary" id="uploadButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 14v5h14v-5"/></svg>自定义背景</button>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
      <button id="resetButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8m0-5v5h5"/></svg>重置画面</button>
      <button id="cameraButton" type="button" aria-pressed="false"><span class="led" aria-hidden="true"></span>摄像头手势</button>
    </footer>
  <div id="cameraBox" class="camera-box" hidden aria-label="双手实时追踪预览">
    <canvas id="cameraPreview" width="640" height="480" aria-label="摄像头画面及每只手的21个关键点"></canvas>
    <div class="progress" id="gestureProgress" role="progressbar" aria-label="双手撕开程度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  </div>
  <video id="cameraVideo" playsinline muted></video>
  <div id="toast" class="toast" role="status" hidden></div>
  </div>
  <script src="gesture.js"></script>
  <script src="app.js?v=20260929-camera-localhost"></script>
</body>
</html>
